name: "ASPM Security & GDPR Compliance Pipeline"

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  security-audit:
    name: "Unified Vulnerability & Compliance Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. SAST Code Security Scan (Semgrep)
      - name: Run Semgrep SAST Analysis
        run: |
          semgrep scan --config rules/security-rules.yml --json targets/app/ > semgrep-report.json || true

      # 2. IaC & Cloud Misconfiguration Scan (Trivy)
      - name: Run Trivy IaC Cloud Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'targets/infra/'
          format: 'json'
          output: 'trivy-iac-report.json'
          exit-code: '0'

      # 3. Hardcoded Secrets Detection (Gitleaks)
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ""
          GITLEAKS_REPORT_PATH: "gitleaks-report.json"

      # 4. Run Custom ASPM Compliance Engine & PR Bot
      - name: Run ASPM Risk Matrix & Post PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python -m bot.pr_security_bot